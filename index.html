<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="favicon.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Browser Tab -->
    <title>Market Sharks | Smart Trading</title>

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="Market Sharks | Smart Trading Community"
    />
    <meta
      name="description"
      content="Market Sharks is a smart trading community providing high-probability setups, market insights, and ongoing support."
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marketsharks.live/" />
    <meta
      property="og:title"
      content="Market Sharks | Smart Trading Community"
    />
    <meta
      property="og:description"
      content="Join Market Sharks — a smart trading community offering high-probability setups, market insights, and ongoing support."
    />
    <meta
      property="og:image"
      content="https://marketsharks.live/og-image.jpg"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://marketsharks.live/" />
    <meta
      name="twitter:title"
      content="Market Sharks | Smart Trading Community"
    />
    <meta
      name="twitter:description"
      content="Smart trading starts with Market Sharks. Get access to high-probability setups, insights, and ongoing support."
    />
    <meta
      name="twitter:image"
      content="https://marketsharks.live/og-image.jpg"
    />
  </head>

  <body>
    <div id="app"></div>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
